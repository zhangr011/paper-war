version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paperwar
      POSTGRES_PASSWORD: paperwar
      POSTGRES_DB: paperwar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperwar"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
